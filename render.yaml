# Render Blueprint Configuration for VibeCraft Ambulance System
# This file defines the services to deploy on Render

services:
  # ==================== AUTH BACKEND (Python/Flask) ====================
  - type: web
    name: vibecraft-auth
    env: python
    region: us-east
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PORT
        value: 5000

  # ==================== AMBULANCE BACKEND (Node.js) ====================
  - type: web
    name: vibecraft-ambulance
    env: node
    region: us-east
    plan: free
    buildCommand: cd ambulance-backend && npm install
    startCommand: cd ambulance-backend && node server.js
    envVars:
      - key: PORT
        value: 3000

  # ==================== FRONTEND (Static Site) ====================
  - type: web
    name: vibecraft-frontend
    env: static
    region: us-east
    plan: free
    buildCommand: cd project && npm install && npm run build
    staticPublishPath: project/dist

